[project]
name = "arenaml"
version = "0.1.0"
description = "One-line AutoML on top of TabArena: cost-aware Bayesian optimisation over leaderboard configurations using performance-vector surrogates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Emiel Witting" }]
keywords = ["automl", "tabarena", "meta-learning", "hyperparameter-optimisation", "bayesian-optimisation"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    # TabArena (and through it AutoGluon) provides the leaderboard artifacts and the model classes.
    # It is not on PyPI; install it from the AutoGluon TabArena repository, see README.
    "tabarena",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
tabarena = { git = "https://github.com/autogluon/tabarena", subdirectory = "packages/tabarena" }
bencheval = { git = "https://github.com/autogluon/tabarena", subdirectory = "packages/bencheval" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: fits real models with AutoGluon (slow)", "artifacts: needs the TabArena artifact cache or internet"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
